name: Syncora Enterprise QA & CI Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]

env:
  NODE_VERSION: '20.x'
  TEST_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/syncora_test_db'
  UPSTASH_REDIS_REST_URL: 'https://mock-redis.upstash.io'
  UPSTASH_REDIS_REST_TOKEN: 'mock-token'
  NEXTAUTH_SECRET: 'enterprise-super-secret-key-2026'

jobs:
  static-analysis:
    name: Lint, Formatting & CodeQL Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute ESLint & Prettier Guards
        run: |
          npm run lint
          npx prettier --check .

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'

      - name: Perform CodeQL Security Analysis
        uses: github/codeql-action/analyze@v3

  unit-integration-tests:
    name: Native Unit & Prisma Integration Quality Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syncora_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Deploy Test Migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Execute Native Unit & Integration Suites
        run: npm run test
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  e2e-system-tests:
    name: Playwright Headless System Journeys
    needs: [static-analysis, unit-integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Execute Playwright E2E Suite
        run: npx playwright test
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

      - name: Upload Playwright Artifacts (Screenshots / Traces)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-traces
          path: playwright-report/
          retention-days: 7

  production-gate-signoff:
    name: Final QA Sign-Off & Deployment Gate
    needs: [e2e-system-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify All Quality Gates Passed
        run: echo "✅ All Static, Unit, Integration, and E2E Quality Gates successfully cleared. System is certified Production & Demo Ready."
